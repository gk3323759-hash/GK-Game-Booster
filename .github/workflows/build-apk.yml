name: Build GK Game Booster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Extract Android Project
        run: unzip -q GK-GAME-BOOSTER.zip

      - name: Build APK
        run: gradle -p GK-GAME-BOOSTER assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GK-Game-Booster-APK
          path: GK-GAME-BOOSTER/app/build/outputs/apk/debug/app-debug.apk
